url: https://itsmdivakaran.github.io/viewR

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#2980b9"
    link-color: "#2980b9"
    navbar-bg: "#1a252f"
    footer-bg: "#1a252f"

navbar:
  bg: dark
  structure:
    left:  [intro, articles, reference, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
        - text: "Get started with viewdt()"
          href: articles/viewdt.html
        - text: "ViewR (legacy gadget) intro"
          href: articles/ViewR-intro.html
    news:
      text: Changelog
      href: news/index.html
    github:
      icon: fab fa-github
      href: https://github.com/itsmdivakaran/viewR
      aria-label: GitHub

home:
  title: "ViewR — The Advanced Interactive Data Table for R"
  description: >
    Turn any data frame into a fast, beautiful, explorable grid. ViewR's
    viewdt() is a dependency-free htmlwidget with Kaggle-style column
    analytics, a Data Insights drawer, a visual query builder, and
    one-click reproducible dplyr / base R / SQL code — plus the classic
    ViewR() Shiny gadget.

  sidebar:
    structure: [links, license, community, citation, authors, dev]

authors:
  Mahesh Divakaran:
    href: https://github.com/itsmdivakaran

reference:
  - title: "Data explorer (v2.0.0)"
    desc: >
      The modern, dependency-free htmlwidget explorer: open, configure,
      and export an interactive data grid.
    contents:
      - viewdt
      - viewdt_options
      - save_viewdt
      - viewdtOutput
      - renderViewdt

  - title: "Legacy Shiny gadget"
    desc: >
      The original popup-based viewer / editor with live dplyr code
      generation.
    contents:
      - ViewR

  - title: "Utilities"
    desc: Helper functions for package management.
    contents:
      - install_viewr_deps

  - title: "Package"
    desc: Package-level documentation.
    contents:
      - ViewR-package

articles:
  - title: "Getting started"
    navbar: ~
    contents:
      - viewdt
      - ViewR-intro

footer:
  structure:
    left: developed_by
    right: built_with

development:
  mode: auto
